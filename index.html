<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorcraft — Color in 3D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="view"></canvas>

<button id="panelToggle" title="Toggle panel (H)">☰</button>

<aside id="panel">
  <header>
    <h1>Colorcraft</h1>
    <p id="count">—</p>
  </header>

  <section>
    <h2>Model</h2>
    <div id="sec-model"></div>
  </section>

  <section>
    <h2>Density</h2>
    <div id="sec-density"></div>
  </section>

  <section>
    <h2>Appearance</h2>
    <div id="sec-appearance"></div>
  </section>

  <section>
    <h2>Slice &amp; filter</h2>
    <div id="sec-slice"></div>
  </section>

  <section>
    <h2>Scene</h2>
    <div id="sec-view"></div>
  </section>

  <footer>
    <p><b>Drag</b> rotate · <b>Shift/right-drag</b> pan · <b>Wheel</b> zoom</p>
    <p><b>Click</b> a point to copy its hex · <b>R</b> reset · <b>Space</b> spin · <b>H</b> hide panel</p>
  </footer>
</aside>

<div id="readout" class="hidden">
  <span class="chip"></span>
  <span class="hex"></span>
  <span class="coords"></span>
</div>

<div id="toast" class="hidden"></div>

<script src="js/color.js"></script>
<script src="js/gamuts.js"></script>
<script src="js/models.js"></script>
<script src="js/cloud.js"></script>
<script src="js/renderer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
